<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="error()" class="error-message">
        <svg fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
        </svg>
        <p>{{ error() }}</p>
      </div>

      <div class="form-group">
        <label for="emailOrName">Email or Name</label>
        <div class="input-container">
          <input
            id="emailOrName"
            type="text"
            formControlName="emailOrName"
            placeholder="Enter your email or name"
            [class.error]="loginForm.get('emailOrName')?.invalid && loginForm.get('emailOrName')?.touched"
          />
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
          </svg>
        </div>
        <p *ngIf="getFieldError('emailOrName')" class="field-error">
          {{ getFieldError('emailOrName') }}
        </p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          <button type="button" (click)="togglePasswordVisibility()" class="password-toggle">
            <svg *ngIf="!showPassword()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
        <p *ngIf="getFieldError('password')" class="field-error">
          {{ getFieldError('password') }}
        </p>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Remember me</span>
        </label>
        <a routerLink="/auth/forgot-password">Forgot password?</a>
      </div>

      <button type="submit" [disabled]="loading()" class="submit-btn">
        <span *ngIf="!loading()">Sign In</span>
        <span *ngIf="loading()" class="loading">
          <div class="spinner"></div>
          Signing In...
        </span>
      </button>
    </form>

    <div class="register-link">
      <p>Don't have an account? <a routerLink="/auth/register">Sign up</a></p>
    </div>
  </div>
</div>
