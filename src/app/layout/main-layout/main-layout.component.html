<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <!-- Mobile Sidebar Overlay -->
  <div 
    *ngIf="sidebarOpen()" 
    class="fixed inset-0 bg-black/50 z-40 lg:hidden transition-opacity duration-300"
    (click)="closeSidebar()"
  ></div>

  <!-- Sidebar -->
  <aside 
    class="fixed top-0 left-0 h-full w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 z-50 transform transition-transform duration-300 ease-in-out lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
  >
    <div class="flex flex-col h-full">
      <!-- Logo -->
      <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white">TodoApp</h1>
        </div>
        <button 
          (click)="closeSidebar()"
          class="lg:hidden text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-2">
        <a 
          routerLink="/dashboard" 
          routerLinkActive="bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200"
          (click)="closeSidebar()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          <span class="font-medium">Dashboard</span>
        </a>

        <a 
          routerLink="/tasks" 
          routerLinkActive="bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400"
          class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200"
          (click)="closeSidebar()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
          </svg>
          <span class="font-medium">Tasks</span>
        </a>

        <a 
          routerLink="/calendar" 
          routerLinkActive="bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400"
          class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200"
          (click)="closeSidebar()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span class="font-medium">Calendar</span>
        </a>

        <a 
          routerLink="/profile" 
          routerLinkActive="bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400"
          class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200"
          (click)="closeSidebar()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <span class="font-medium">Profile</span>
        </a>

        <a 
          routerLink="/settings" 
          routerLinkActive="bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400"
          class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200"
          (click)="closeSidebar()"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span class="font-medium">Settings</span>
        </a>
      </nav>

      <!-- User Section -->
      <div class="p-4 border-t border-gray-200 dark:border-gray-700">
        <div class="flex items-center space-x-3 mb-3">
          <img 
            [src]="currentUser()?.profilePicture || 'https://ui-avatars.com/api/?name=' + (currentUser()?.firstName || 'User') + '+' + (currentUser()?.lastName || '')"
            [alt]="currentUser()?.firstName || 'User'"
            class="w-10 h-10 rounded-full object-cover border-2 border-gray-200 dark:border-gray-700"
          />
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 dark:text-white truncate">
              {{ currentUser()?.firstName }} {{ currentUser()?.lastName }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">
              {{ currentUser()?.email }}
            </p>
          </div>
        </div>
        <button 
          (click)="logout(); closeSidebar()"
          class="w-full flex items-center justify-center space-x-2 px-4 py-2 text-sm text-danger-600 dark:text-danger-400 hover:bg-danger-50 dark:hover:bg-danger-900/20 rounded-lg transition-colors duration-200"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="lg:ml-64 min-h-screen">
    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-800/80 backdrop-blur-lg border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center justify-between px-4 py-3 lg:px-6 lg:py-4">
        <div class="flex items-center space-x-3 lg:space-x-4">
          <button
            (click)="toggleSidebar()"
            class="lg:hidden text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h2 class="text-lg lg:text-xl font-semibold text-gray-900 dark:text-white">
            {{ getPageTitle() }}
          </h2>
        </div>

        <div class="flex items-center space-x-1 md:space-x-2 lg:space-x-4">
          <!-- Digital Clock - Hidden on very small screens -->
          <div class="hidden sm:block">
            <app-digital-clock></app-digital-clock>
          </div>

          <!-- Theme Toggle -->
          <button
            (click)="toggleTheme()"
            class="p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200"
            [title]="'Theme: ' + getThemeLabel()"
          >
            <span class="text-lg">{{ getThemeIcon() }}</span>
          </button>

          <!-- Notifications -->
          <div class="relative">
            <button 
              (click)="toggleNotifications()"
              class="relative p-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
              </svg>
              <span 
                *ngIf="unreadCount() > 0"
                class="absolute top-0 right-0 w-5 h-5 bg-danger-500 text-white text-xs font-bold rounded-full flex items-center justify-center"
              >
                {{ unreadCount() > 9 ? '9+' : unreadCount() }}
              </span>
            </button>

            <!-- Notifications Dropdown -->
            <div 
              *ngIf="showNotifications()"
              class="absolute right-0 mt-2 w-80 bg-white dark:bg-gray-800 rounded-lg shadow-xl border border-gray-200 dark:border-gray-700 z-50 max-h-96 overflow-y-auto custom-scrollbar"
            >
              <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <h3 class="font-semibold text-gray-900 dark:text-white">Notifications</h3>
                <button 
                  (click)="markAllNotificationsAsRead()"
                  class="text-sm text-primary-600 dark:text-primary-400 hover:underline"
                  *ngIf="unreadCount() > 0"
                >
                  Mark all as read
                </button>
              </div>
              <div class="divide-y divide-gray-200 dark:divide-gray-700">
                <div 
                  *ngFor="let notification of notifications()"
                  class="p-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 cursor-pointer transition-colors duration-200"
                  [class.bg-primary-50/50]="!notification.read"
                  (click)="markNotificationAsRead(notification.id)"
                >
                  <div class="flex items-start space-x-3">
                    <div class="flex-shrink-0">
                      <div 
                        class="w-2 h-2 rounded-full"
                        [class.bg-primary-500]="!notification.read"
                        [class.bg-transparent]="notification.read"
                      ></div>
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="text-sm font-medium text-gray-900 dark:text-white">
                        {{ notification.title }}
                      </p>
                      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                        {{ notification.message }}
                      </p>
                      <p class="text-xs text-gray-400 dark:text-gray-500 mt-2">
                        {{ getTimeAgo(notification.createdAt) }}
                      </p>
                    </div>
                  </div>
                </div>
                <div 
                  *ngIf="notifications().length === 0"
                  class="p-8 text-center text-gray-500 dark:text-gray-400"
                >
                  <p>No notifications</p>
                </div>
              </div>
            </div>
          </div>

          <!-- User Avatar -->
          <div class="flex items-center space-x-3">
            <img 
              [src]="currentUser()?.profilePicture || 'https://ui-avatars.com/api/?name=' + (currentUser()?.firstName || 'User') + '+' + (currentUser()?.lastName || '')"
              [alt]="currentUser()?.firstName || 'User'"
              class="w-10 h-10 rounded-full object-cover border-2 border-gray-200 dark:border-gray-700"
            />
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="p-3 sm:p-4 lg:p-6 min-h-[calc(100vh-80px)] lg:min-h-[calc(100vh-100px)]">
      <router-outlet />
    </main>

    <!-- Notification Popups -->
    <app-notification-popup
      *ngFor="let notification of notificationPopups()"
      [notification]="notification"
      (dismissed)="dismissNotification($event)"
    ></app-notification-popup>

    <!-- Welcome Popup -->
    <app-welcome-popup
      [show]="showWelcomePopup()"
      (dismissed)="onWelcomeDismissed()"
      (goToProfile)="onWelcomeGoToProfile()"
    ></app-welcome-popup>

    <!-- Congratulation Popups -->
    <app-congratulation-popup
      *ngFor="let congratulation of congratulationPopups()"
      [congratulation]="congratulation"
      (dismissed)="dismissCongratulation($event)"
    ></app-congratulation-popup>

    <!-- Confirmation Dialog -->
    <app-confirmation-dialog
      [isVisible]="confirmationDialogVisible()"
      [data]="confirmationDialogData()"
      (confirmed)="onConfirmationDialogConfirmed()"
      (cancelled)="onConfirmationDialogCancelled()"
    ></app-confirmation-dialog>
  </div>
</div>
